<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Belleville · French RPG</title>
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      src: url('assets/fonts/PixelifySans.ttf') format('truetype');
      font-weight: 400 700;
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    /* dvh = the visible height, excluding the mobile address bar (100vh includes it). */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; touch-action: none; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
