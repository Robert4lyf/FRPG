<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Belleville · French RPG</title>
  <!-- Home-screen app: opens full-screen with no address bar -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2b2d42">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Belleville">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      src: url('assets/fonts/PixelifySans.ttf') format('truetype');
      font-weight: 400 700;
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #2b2d42; overflow: hidden; overscroll-behavior: none; }
    /* dvh = the visible height, excluding the mobile address bar (100vh includes it).
       Safe-area insets keep the game clear of notches and the home bar when full-screen. */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      touch-action: none;
    }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
